<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Selector Tool</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>



    <h1>Photo Deletion Review</h1>
    <p class="instructions">Tap or click on any photos you want to <strong>DELETE</strong>. A red border will mark your selections. When finished, tap the button at the bottom.</p>

    <div class="grid" id="photoGrid"></div>

    <div class="footer-bar">

    <!-- 
      =========================================
      1. UN-BLOCKABLE EMAIL FORM
      =========================================
    -->
    <form action="https://web3forms.com" method="POST" id="photoForm" onsubmit="prepareAndMarkDeleted()">
        <!-- ⚠️ PASTE YOUR WEB3FORMS ACCESS KEY IN THE VALUE BELOW -->
  <input type="hidden" name="access_key" value="3dda0e4c-6471-46d2-81b4-37a9fc909736">
  <input type="hidden" name="subject" value="📸 New Photo Selection Received!">
  
  <input type="hidden" name="name" value= "Jeta Link">
  <input type="hidden" name="email" value= "jetalinkinc@gmail.com">

  <!-- Hidden text box to hold the clean file list -->
  <textarea name="message" id="hiddenPhotoList" style="display:none;"></textarea>

  <button class="btn" type="submit" onclick="prepareAndMarkDeleted(event)">Submit Selection</button>
        <button type="button" class="btn-reset" onclick="resetPageMemory()">Reset Page</button>
    </form>


    </div>



    <!-- Results Modal -->
    <div class="modal" id="resultModal">
        <div class="modal-content">
            <h3>Your Selection List</h3>
            <p>Copy this text and send it back to me:</p>
            <textarea id="listText" readonly></textarea>
            <button class="btn" style="background-color: #34c759;" onclick="copyAndClose()">Copy Text & Close</button>
        </div>
    </div>

   

<script src="main.js"></script>

</body>
</html>
